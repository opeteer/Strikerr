version: '3.8'

services:
  strikerr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strikerr-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - GIN_MODE=release
      - DATABASE_URL=postgres://strikerr_user:strikerr_password@postgres:5432/strikerr_db?sslmode=disable
      - REDIS_URL=redis:6379
      - TSA_URL=https://freetsa.org/tsr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - strikerr-network

  postgres:
    image: postgres:15-alpine
    container_name: strikerr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strikerr_user
      POSTGRES_PASSWORD: strikerr_password
      POSTGRES_DB: strikerr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strikerr_user -d strikerr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - strikerr-network

  redis:
    image: redis:7-alpine
    container_name: strikerr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - strikerr-network

networks:
  strikerr-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
