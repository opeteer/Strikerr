version: '3.9'

networks:
  strikerr-app-net:
    driver: bridge
    internal: false
  strikerr-crawler-dmz:
    driver: bridge
    internal: true # Isolated queue and artifact buffer
  strikerr-egress-net:
    driver: bridge
    internal: false # Outbound connectivity exclusively via egress proxy

services:
  # ==============================================================================
  # PRIMARY DATA STORES & TASK BROKERS
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: strikerr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strikerr_db
      POSTGRES_USER: strikerr_usr
      POSTGRES_PASSWORD: strikerr_secret_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - strikerr-app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strikerr_usr -d strikerr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: strikerr-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "strikerr_redis_pw"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - strikerr-app-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: strikerr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: strikerr_rmq
      RABBITMQ_DEFAULT_PASS: strikerr_rmq_pw
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - strikerr-app-net
      - strikerr-crawler-dmz
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: strikerr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: strikerr_minio_admin
      MINIO_ROOT_PASSWORD: strikerr_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - strikerr-app-net
      - strikerr-crawler-dmz

  # ==============================================================================
  # DJANGO APPLICATION CORE (Web & SOC Console)
  # ==============================================================================
  django-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: strikerr-django-web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=strikerr.settings.development
      - DATABASE_URL=postgresql://strikerr_usr:strikerr_secret_pw@postgres:5432/strikerr_db
      - REDIS_URL=redis://:strikerr_redis_pw@redis:6379/0
      - RABBITMQ_URL=amqp://strikerr_rmq:strikerr_rmq_pw@rabbitmq:5672//
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=strikerr_minio_admin
      - MINIO_SECRET_KEY=strikerr_minio_secret_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - strikerr-app-net

  # ==============================================================================
  # CELERY WORKERS: TRIAGE & HEURISTIC ENGINE
  # ==============================================================================
  celery-worker-triage:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: strikerr-worker-triage
    restart: unless-stopped
    command: ["celery", "-A", "strikerr.celery", "worker", "-Q", "triage_queue,analysis_queue", "-c", "4", "-l", "INFO"]
    environment:
      - DJANGO_SETTINGS_MODULE=strikerr.settings.development
      - DATABASE_URL=postgresql://strikerr_usr:strikerr_secret_pw@postgres:5432/strikerr_db
      - REDIS_URL=redis://:strikerr_redis_pw@redis:6379/0
      - RABBITMQ_URL=amqp://strikerr_rmq:strikerr_rmq_pw@rabbitmq:5672//
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=strikerr_minio_admin
      - MINIO_SECRET_KEY=strikerr_minio_secret_key
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - strikerr-app-net

  # ==============================================================================
  # CELERY WORKERS: HARDENED HEADLESS CRAWLER (Quarantined in DMZ)
  # ==============================================================================
  celery-worker-headless:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile.crawler
    container_name: strikerr-worker-headless
    restart: unless-stopped
    command: ["celery", "-A", "strikerr.celery", "worker", "-Q", "headless_queue", "-c", "2", "--max-tasks-per-child=25", "-l", "INFO"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
      - /dev/shm:size=256m,noexec,nosuid,nodev
      - /home/pwuser/.config:size=64m,noexec,nosuid,nodev
      - /home/pwuser/.cache:size=64m,noexec,nosuid,nodev
    environment:
      - RABBITMQ_URL=amqp://strikerr_rmq:strikerr_rmq_pw@rabbitmq:5672//
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=strikerr_minio_admin
      - MINIO_SECRET_KEY=strikerr_minio_secret_key
    depends_on:
      - rabbitmq
      - minio
    networks:
      - strikerr-crawler-dmz # No direct access to Postgres or Redis!

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
