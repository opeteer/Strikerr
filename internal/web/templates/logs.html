<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strikerr | Tactical Red Logs Stream</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        . { box-shadow: 0 0 30px -5px rgba(225, 29, 72, 0.3); }
        /* Custom Red Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-[#141414] text-zinc-200 antialiased flex h-screen overflow-hidden" x-data="{ sidebarOpen: false }">

    <!-- Sidebar -->
    <aside class="flex-shrink-0 w-64 bg-[#141414] border-r border-zinc-800 flex flex-col transition-all duration-300 z-20 absolute inset-y-0 left-0 transform md:relative md:translate-x-0" :class="{'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen}">
        <div class="h-16 flex items-center px-6 border-b border-zinc-800 bg-[#1a1a1a]">
            <i class="ph-fill ph-shield-warning text-blue-500 text-2xl mr-3 animate-pulse"></i>
            <span class="text-xl font-black tracking-wider text-white bg-gradient-to-r from-blue-500 via-red-500 to-blue-400 bg-clip-text text-transparent">STRIKERR</span>
            <span class="ml-2 text-[10px] font-mono px-2 py-0.5 bg-zinc-800 text-zinc-300 border border-zinc-700 rounded-full font-bold">RED</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="/" class="flex items-center px-4 py-3 rounded-xl text-zinc-400 hover:bg-zinc-800 hover:text-zinc-300 transition-all">
                <i class="ph ph-squares-four text-lg mr-3"></i> Dashboard Ops
            </a>
            <a href="/mule-accounts" class="flex items-center px-4 py-3 rounded-xl text-zinc-400 hover:bg-zinc-800 hover:text-zinc-300 transition-all">
                <i class="ph ph-bank text-lg mr-3"></i> Mule Accounts
            </a>
            <a href="/logs" class="flex items-center px-4 py-3 rounded-xl bg-zinc-800 text-zinc-300 font-semibold border border-zinc-700 shadow-lg shadow-none transition-all">
                <i class="ph-fill ph-terminal-window text-lg mr-3 text-blue-500"></i> Real-time Logs
            </a>
            <a href="/api/v1/feeds/mule-accounts" target="_blank" class="flex items-center px-4 py-3 rounded-xl text-zinc-400 hover:bg-zinc-800 hover:text-zinc-300 transition-all">
                <i class="ph ph-code-block text-lg mr-3"></i> B2B API Feeds
            </a>
        </nav>
    </aside>

    <!-- Main Window -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Top Bar -->
        <header class="h-16 bg-[#1a1a1a] border-b border-zinc-800 flex items-center justify-between px-6 flex-shrink-0">
            <div class="flex items-center">
                <button @click="sidebarOpen = !sidebarOpen" class="md:hidden text-zinc-400 hover:text-zinc-300 mr-4 focus:outline-none">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <h1 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
                    <i class="ph ph-terminal text-blue-500 text-xl"></i> Real-time Execution Terminal
                </h1>
            </div>

            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono font-bold bg-zinc-800 text-zinc-300 border border-zinc-700/60">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
                    STREAMING ACTIVE
                </span>
            </div>
        </header>

        <!-- Terminal Container -->
        <main class="flex-1 p-6 overflow-hidden flex flex-col" x-data="logViewer()">
            <div class="flex-1 bg-black/90 border border-zinc-800/40 rounded-2xl flex flex-col overflow-hidden ">
                
                <!-- Terminal Header Bar -->
                <div class="bg-[#141414] px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-blue-600"></div>
                        <div class="w-3 h-3 rounded-full bg-zinc-700"></div>
                        <div class="w-3 h-3 rounded-full bg-zinc-800"></div>
                        <span class="ml-3 text-xs font-mono text-blue-300/70">root@strikerr-core:/var/log/strikerr.log</span>
                    </div>
                    <button @click="fetchLogs()" class="text-xs text-zinc-300 hover:text-white font-mono flex items-center gap-1">
                        <i class="ph ph-arrows-clockwise text-sm"></i> REFRESH
                    </button>
                </div>

                <!-- Log Output Lines -->
                <div id="log-container" class="flex-1 p-5 overflow-y-auto font-mono text-xs leading-relaxed space-y-1.5" style="scroll-behavior: smooth;">
                    <template x-for="log in logs">
                        <div class="hover:bg-zinc-800/30 px-2 py-1 rounded transition-colors break-all flex gap-3 border-l-2 border-transparent hover:border-blue-500">
                            <span class="text-blue-500/60 select-none" x-text="getTime()"></span>
                            <span class="text-blue-200" x-text="log"></span>
                        </div>
                    </template>
                    <div x-show="logs.length === 0" class="text-zinc-600 italic">Waiting for log stream data...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function logViewer() {
            return {
                logs: [],
                init() {
                    this.fetchLogs();
                    setInterval(() => { this.fetchLogs(); }, 2000);
                },
                getTime() {
                    const now = new Date();
                    return `[${now.toLocaleTimeString('en-US', { hour12: false })}]`;
                },
                fetchLogs() {
                    fetch('/api/v1/logs')
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.length > 0) {
                                const container = document.getElementById('log-container');
                                const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
                                this.logs = data;
                                if (isAtBottom) {
                                    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
                                }
                            }
                        })
                        .catch(err => console.error("Error fetching logs:", err));
                }
            }
        }
    </script>
</body>
</html>
