<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strikerr | Analytics Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#3b82f6', 900: '#1e3a8a', 950: '#172554' } } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        . { box-shadow: 0 0 25px -5px rgba(225, 29, 72, 0.25); }
    </style>
</head>
<body class="bg-[#141414] text-zinc-200 antialiased flex h-screen overflow-hidden" x-data="{ sidebarOpen: false }">

    <aside class="flex-shrink-0 w-64 bg-[#141414] border-r border-zinc-800 flex flex-col z-20 absolute inset-y-0 left-0 md:relative">
        <div class="h-16 flex items-center px-6 border-b border-zinc-800 bg-[#1a1a1a]">
            <i class="ph-fill ph-shield-warning text-blue-500 text-2xl mr-3"></i>
            <span class="text-xl font-black text-white">STRIKERR</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="flex items-center px-4 py-3 rounded-xl text-zinc-400 hover:bg-zinc-800 hover:text-zinc-300">
                <i class="ph ph-squares-four text-lg mr-3"></i> Dashboard Ops
            </a>
            <a href="/analytics" class="flex items-center px-4 py-3 rounded-xl bg-zinc-800 text-zinc-300 font-semibold border border-zinc-700 shadow-lg shadow-none">
                <i class="ph-fill ph-chart-bar text-lg mr-3 text-blue-500"></i> Analytics Suite
            </a>
            <a href="/mule-accounts" class="flex items-center px-4 py-3 rounded-xl text-zinc-400 hover:bg-zinc-800 hover:text-zinc-300">
                <i class="ph ph-bank text-lg mr-3"></i> Mule Accounts
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-[#1a1a1a] border-b border-zinc-800 flex items-center justify-between px-6">
            <h1 class="text-lg font-bold text-white"><i class="ph ph-chart-line-up text-blue-500 mr-2"></i> Threat Telemetry Analytics</h1>
            <button class="bg-zinc-800 text-blue-300 border border-zinc-700/60 text-xs px-4 py-2 rounded-xl" onclick="alert('PDF Dossier Generated!')">
                <i class="ph ph-file-pdf"></i> Download PDF Report
            </button>
        </header>
        
        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-[#1a1a1a] border border-zinc-800 rounded-2xl p-6 ">
                    <h3 class="text-base font-bold text-white mb-4">Typosquatting Risk Dist.</h3>
                    <div class="h-64"><canvas id="radarChart"></canvas></div>
                </div>
                <div class="bg-[#1a1a1a] border border-zinc-800 rounded-2xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Financial Extractions</h3>
                    <div class="h-64"><canvas id="barChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Radar Chart
        new Chart(document.getElementById('radarChart').getContext('2d'), {
            type: 'radar',
            data: {
                labels: ['Homograph', 'Bitsquatting', 'Hyphenation', 'Omission', 'Vowel-Swap'],
                datasets: [{
                    label: 'Detected Variations',
                    data: [12, 19, 3, 5, 2],
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: '#3b82f6',
                    pointBackgroundColor: '#3b82f6'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { r: { grid: { color: '#1e3a8a' }, ticks: { display: false } } }
            }
        });

        // Bar Chart
        new Chart(document.getElementById('barChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['BCA', 'Mandiri', 'BRI', 'BNI', 'DANA', 'OVO'],
                datasets: [{
                    label: 'Frozen Accounts',
                    data: [20, 15, 8, 12, 25, 18],
                    backgroundColor: '#3b82f6',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { grid: { color: 'rgba(63, 63, 70, 0.5)' } }, x: { grid: { display: false } } }
            }
        });
    </script>
</body>
</html>
