[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strikerr"
version = "0.1.0"
description = "Automated Threat Hunting, Detection Engine & Evidence Vault for Scam, Online Gambling (Judol), and Phishing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Strikerr Security Architecture Team", email = "security@strikerr.id" }
]
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "celery[redis,rabbitmq]>=5.4.0",
    "redis>=5.0.0",
    "curl_cffi>=0.7.2",
    "httpx>=0.27.0",
    "playwright>=1.46.0",
    "pyahocorasick>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "dnspython>=2.6.1",
    "tldextract>=5.1.2",
    "cryptography>=43.0.0",
    "minio>=7.2.7",
    "pydantic>=2.8.0",
    "asgiref>=3.8.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short -o cache_dir=/tmp/.pytest_cache"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
